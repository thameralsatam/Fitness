    <style>
      @font-face {
        font-family: 'Thmanyah Sans';
        src: url('/fonts/thmanyahsans-Medium.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      :root {
        --font-display: 'Thmanyah Sans', sans-serif;
        --font-body: 'Thmanyah Sans', sans-serif;
      }
    </style>
    <script>
      (function() {
        try {
          var tf = localStorage.getItem('gym_custom_title_font');
          if (tf && window.FontFace) {
            var f1 = new FontFace('CustomTitleFont', 'url(' + tf + ')');
            f1.load().then(function(loaded) { document.fonts.add(loaded); }).catch(function() {});
          }
          var bf = localStorage.getItem('gym_custom_body_font');
          if (bf && window.FontFace) {
            var f2 = new FontFace('CustomBodyFont', 'url(' + bf + ')');
            f2.load().then(function(loaded) { document.fonts.add(loaded); }).catch(function() {});
          }
          var d = localStorage.getItem('gym_font_display');
          var b = localStorage.getItem('gym_font_body');
          if (d) document.documentElement.style.setProperty('--font-display', d);
          if (b) document.documentElement.style.setProperty('--font-body', b);
          var lang = localStorage.getItem('gym_lang');
          if (lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          }
        } catch(e) {}
      })();
    </script>
